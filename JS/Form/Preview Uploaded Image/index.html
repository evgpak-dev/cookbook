<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Uploaded Image Preview</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .form-card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 400px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .form-field {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
      }

      .form-field label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .preview-box {
        width: 80px;
        height: 80px;
        border: 2px dashed #cbd5e1;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f1f5f9;
        flex-shrink: 0;
        margin: 0 auto;
      }

      .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .preview-box span {
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <form class="form-card" id="profile-form">
      <h3>Preview the Uploaded Image</h3>

      <div class="form-field">
        <div>
          <label for="image-input">Select Image</label>
          <input type="file" id="image-input" accept="image/*" />
        </div>

        <div class="preview-box">
          <img id="image-preview" alt="Selected Preview" />
          <span id="preview-placeholder">No image</span>
        </div>
      </div>
    </form>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
